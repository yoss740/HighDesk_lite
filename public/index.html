<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highdesk — Sign In</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1><span class="brand">Highdesk</span></h1>
      <p class="subtitle">Internal Help Desk — Sign in to continue</p>

      <div id="alert" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Corporate Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email">
          <div class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <div class="field-error"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
      </form>

      <div class="divider">or</div>

      <button type="button" class="btn btn-sso" id="sso-btn">Sign in with SSO</button>

      <p class="auth-footer">
        Don't have an account? <a href="/register.html">Create one</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
