<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highdesk — My Tickets</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Highdesk</h1>
    <div class="user-info">
      <span id="user-name"></span>
      <span class="role-badge" id="user-role"></span>
      <button type="button" class="btn btn-sm btn-secondary" id="logout-btn">Logout</button>
    </div>
  </header>

  <nav class="app-nav" id="app-nav">
    <a href="/dashboard.html" class="active">My Tickets</a>
  </nav>

  <main class="main-content">
    <div class="grid-2">
      <section class="faq-section card">
        <h2>Self-Service FAQ</h2>
        <p style="margin-bottom:1rem;font-size:0.875rem;color:#666;">Search our knowledge base before opening a ticket.</p>
        <div class="faq-search">
          <input type="text" id="faq-search" placeholder="Search FAQs…">
          <select id="faq-category">
            <option value="All">All Categories</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Facilities">Facilities</option>
            <option value="General">General</option>
          </select>
        </div>
        <div class="faq-list" id="faq-list"></div>
      </section>

      <section class="card ticket-form">
        <h2>Submit a Ticket</h2>
        <div id="ticket-alert" class="alert hidden"></div>
        <form id="ticket-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Brief summary (5–100 chars)">
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select category…</option>
              <option value="IT">IT</option>
              <option value="HR">HR</option>
              <option value="Facilities">Facilities</option>
            </select>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="urgency">Urgency</label>
            <select id="urgency" name="urgency">
              <option value="">Select urgency…</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe your issue in detail (20–1000 chars)"></textarea>
            <div class="char-count"><span id="desc-count">0</span> / 1000</div>
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary">Submit Ticket</button>
        </form>
      </section>
    </div>

    <section class="card" style="margin-top:2rem;">
      <h2>My Tickets</h2>
      <div id="tickets-container">
        <table class="ticket-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Urgency</th>
              <th>Status</th>
              <th>Assignee</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="tickets-body"></tbody>
        </table>
        <div id="empty-tickets" class="empty-state hidden">No tickets yet. Submit one above!</div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
